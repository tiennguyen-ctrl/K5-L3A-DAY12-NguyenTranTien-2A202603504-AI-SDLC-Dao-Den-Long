<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a1a; font-family: system-ui, "Segoe UI", sans-serif; color: #fff1d6; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
    .chip { background: rgba(20, 14, 40, .72); border: 1px solid rgba(255, 179, 71, .45); border-radius: 12px; padding: 6px 12px; font-size: 15px; backdrop-filter: blur(4px); }
    .chip b { color: #ffb347; }
    .bad { color: #b79cff; }
    #hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: rgba(20, 14, 40, .8); border: 1px solid #ffb347; border-radius: 12px; padding: 8px 16px; display: none; }
    #toast { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
    #toast div { background: rgba(20, 14, 40, .75); border-radius: 10px; padding: 6px 14px; margin-top: 6px; animation: fade 2.4s forwards; }
    @keyframes fade { 0% { opacity: 0; transform: translateY(-6px) } 10% { opacity: 1; transform: none } 80% { opacity: 1 } 100% { opacity: 0 } }
    #flash { position: fixed; inset: 0; background: radial-gradient(transparent 40%, rgba(90, 40, 170, .7)); opacity: 0; pointer-events: none; transition: opacity .5s; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 6, 20, .72); }
    #card { max-width: 520px; text-align: center; padding: 28px 34px; background: rgba(30, 20, 55, .92); border: 1px solid #ffb347; border-radius: 18px; box-shadow: 0 0 60px rgba(255, 179, 71, .25); }
    #card h1 { margin: 0 0 6px; color: #ffb347; font-size: 34px; }
    #card p { margin: 8px 0; line-height: 1.5; }
    #card small { color: #c9b9a0; }
    button { margin-top: 14px; font: inherit; font-weight: 700; color: #2a1608; background: #ffb347; border: 0; border-radius: 12px; padding: 10px 24px; cursor: pointer; }
    kbd { background: rgba(255, 255, 255, .12); border-radius: 5px; padding: 1px 6px; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="flash"></div>
  <div id="overlay"><div id="card"></div></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
